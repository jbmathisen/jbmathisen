<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" width="900" height="280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&amp;display=swap');

      .bg { fill: #1C2BA4; }
      .name { 
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 52px;
        font-weight: 700;
        fill: #ffffff;
        letter-spacing: -1px;
      }
      .title {
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 15px;
        font-weight: 400;
        fill: rgba(255,255,255,0.65);
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .tag {
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 12px;
        font-weight: 400;
        fill: rgba(255,255,255,0.5);
        letter-spacing: 0.5px;
      }
      .tag-bg {
        fill: rgba(255,255,255,0.08);
        rx: 3;
      }
      .line {
        stroke: rgba(255,255,255,0.15);
        stroke-width: 1;
      }
      .accent {
        fill: #C5FB6E;
      }
      .bracket {
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 52px;
        font-weight: 300;
        fill: rgba(255,255,255,0.25);
        letter-spacing: -1px;
      }

      /* Animations */
      .fade-name {
        animation: fadeUp 0.8s ease forwards;
        opacity: 0;
      }
      .fade-title {
        animation: fadeUp 0.8s 0.3s ease forwards;
        opacity: 0;
      }
      .fade-tags {
        animation: fadeUp 0.8s 0.55s ease forwards;
        opacity: 0;
      }
      .fade-line {
        animation: expandLine 1s 0.2s ease forwards;
        transform-origin: left;
        transform: scaleX(0);
      }
      .fade-dot {
        animation: popIn 0.4s 0.9s ease forwards;
        opacity: 0;
        transform-origin: center;
        transform: scale(0);
      }
      .blob {
        animation: drift 8s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .blob2 {
        animation: drift2 10s ease-in-out infinite alternate;
        transform-origin: center;
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes expandLine {
        from { transform: scaleX(0); }
        to   { transform: scaleX(1); }
      }
      @keyframes popIn {
        from { opacity: 0; transform: scale(0); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes drift {
        from { transform: translate(0px, 0px) scale(1); }
        to   { transform: translate(12px, -8px) scale(1.05); }
      }
      @keyframes drift2 {
        from { transform: translate(0px, 0px) scale(1); }
        to   { transform: translate(-10px, 12px) scale(0.95); }
      }
    </style>

    <!-- Blur filter for blobs -->
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect class="bg" width="900" height="280" rx="0"/>

  <!-- Ambient blobs -->
  <ellipse class="blob" cx="760" cy="80" rx="130" ry="100" fill="#2E40C8" filter="url(#blur1)" opacity="0.7"/>
  <ellipse class="blob2" cx="820" cy="200" rx="90" ry="70" fill="#C5FB6E" filter="url(#blur2)" opacity="0.12"/>
  <ellipse class="blob" cx="680" cy="230" rx="80" ry="60" fill="#1C2BA4" filter="url(#blur1)" opacity="0.5"/>

  <!-- Bracket accent left -->
  <text x="52" y="158" class="bracket fade-name">[</text>

  <!-- Name -->
  <text x="80" y="158" class="name fade-name">Jonathan Mathisen</text>

  <!-- Closing bracket -->
  <text x="458" y="158" class="bracket fade-name">]</text>

  <!-- Accent dot -->
  <circle class="accent fade-dot" cx="494" cy="144" r="5"/>

  <!-- Divider line -->
  <line class="line fade-line" x1="80" y1="175" x2="500" y2="175"/>

  <!-- Title -->
  <text x="80" y="200" class="title fade-title">Strategy · Design · Builds</text>

  <!-- Tags -->
  <g class="fade-tags">
    <!-- Tag 1 -->
    <rect x="80" y="220" width="138" height="24" rx="3" fill="rgba(255,255,255,0.08)"/>
    <text x="90" y="236" class="tag">smoothbrain builder</text>

    <!-- Tag 2 -->
    <rect x="228" y="220" width="168" height="24" rx="3" fill="rgba(255,255,255,0.08)"/>
    <text x="238" y="236" class="tag">big brain creative consultant</text>
  </g>

</svg>
