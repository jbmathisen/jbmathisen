<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" width="900" height="280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .bg { fill: #1C2BA4; }
      .name {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 52px;
        font-weight: 700;
        fill: #ffffff;
        letter-spacing: -1px;
      }
      .bracket {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 52px;
        font-weight: 300;
        fill: rgba(255,255,255,0.25);
      }
      .subtitle {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 11px;
        font-weight: 400;
        fill: rgba(255,255,255,0.5);
        letter-spacing: 2.5px;
      }
      .tag {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 12px;
        font-weight: 500;
        fill: #C5FB6E;
        letter-spacing: 0.3px;
      }

      .fade-in {
        animation: fadeUp 0.8s ease forwards;
        opacity: 0;
      }
      .fade-in-2 {
        animation: fadeUp 0.8s 0.25s ease forwards;
        opacity: 0;
      }
      .fade-in-3 {
        animation: fadeUp 0.8s 0.5s ease forwards;
        opacity: 0;
      }
      .blob {
        animation: drift 8s ease-in-out infinite alternate;
      }
      .blob2 {
        animation: drift2 10s ease-in-out infinite alternate;
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes drift {
        from { transform: translate(0px, 0px); }
        to   { transform: translate(12px, -8px); }
      }
      @keyframes drift2 {
        from { transform: translate(0px, 0px); }
        to   { transform: translate(-10px, 12px); }
      }
    </style>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect class="bg" width="900" height="280"/>

  <!-- Blobs -->
  <ellipse class="blob" cx="760" cy="90" rx="140" ry="110" fill="#2E40C8" filter="url(#blur1)" opacity="0.7"/>
  <ellipse class="blob2" cx="830" cy="210" rx="100" ry="80" fill="#C5FB6E" filter="url(#blur2)" opacity="0.1"/>

  <!-- Name row -->
  <g class="fade-in">
    <text x="68" y="158" class="bracket">[</text>
    <text x="96" y="158" class="name">Jonathan Mathisen</text>
    <text x="574" y="158" class="bracket">]</text>
    <circle cx="606" cy="144" r="5" fill="#C5FB6E"/>
  </g>

  <!-- Divider -->
  <line class="fade-in-2" x1="96" y1="174" x2="610" y2="174" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Subtitle -->
  <text x="96" y="196" class="subtitle fade-in-2">STRATEGY · DESIGN · BUILDS</text>

  <!-- Tags in accent color, pipe divider -->
  <g class="fade-in-3">
    <text x="96" y="232" class="tag" textLength="129" lengthAdjust="spacing">smoothbrain builder</text>
    <line x1="237" y1="221" x2="237" y2="233" stroke="#C5FB6E" stroke-width="1" opacity="0.5"/>
    <text x="249" y="232" class="tag">big brain creative consultant</text>
  </g>

</svg>
